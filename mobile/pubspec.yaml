name: cosechacoin_mobile
description: "CosechaCoin — app móvil para productores e inversores."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_cosecha.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_cosecha.png"
  adaptive_icon_background: "#1A5C38"
  adaptive_icon_foreground: "assets/images/logo_cosecha.png"
